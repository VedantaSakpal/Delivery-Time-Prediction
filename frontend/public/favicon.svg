<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Electric Coral to Vibrant Berry Sunset -->
    <linearGradient id="jw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="45%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#F50057" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="jw-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="jw-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF1744" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#jw-bg)" filter="url(#jw-shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="26.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />

  <!-- Dynamic Speed 'W' Monogram -->
  <path
    d="M 28 42 L 44 78 L 57 48 L 70 78 L 86 42"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Joyful Accent Swoosh Smile Underneath -->
  <path
    d="M 38 88 Q 60 99 82 88"
    fill="none"
    stroke="#FFE082"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Energetic 4-Point 'WOW' Sparkle Star -->
  <path
    d="M 94 24 Q 94 30 100 30 Q 94 30 94 36 Q 94 30 88 30 Q 94 30 94 24 Z"
    fill="url(#jw-star)"
  />
  <circle cx="94" cy="30" r="1.5" fill="#FFFFFF" />
</svg>
